                        return (
                          <div 
                            key={q.id}
                            className={`p-4 rounded-xl border text-xs space-y-2.5 transition-all ${
                              isCorrect ? 'bg-emerald-50/50 border-emerald-200' :
                              isUnattempted ? 'bg-amber-50/50 border-amber-200' : 'bg-rose-50/50 border-rose-200'
                            }`}
                          >
                            <div className="flex justify-between items-start gap-2">
                              <span className="font-bold text-slate-900 flex items-center gap-2">
                                <span>Q{qIdx + 1}. {q.question}</span>
                                {isFlagged && (
                                  <span className="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded font-bold flex items-center gap-1">
                                    <Icon name="flag" className="w-3 h-3 text-amber-600" /> Flagged
                                  </span>
                                )}
                              </span>
                              <span className={`px-2 py-0.5 rounded font-bold text-[10px] whitespace-nowrap shrink-0 ${
                                isCorrect ? 'bg-emerald-600 text-white' :
                                isUnattempted ? 'bg-amber-500 text-white' : 'bg-rose-600 text-white'
                              }`}>
                                {isCorrect ? 'CORRECT (+1.0)' : isUnattempted ? 'SKIPPED (0.0)' : 'WRONG (-0.25)'}
                              </span>
                            </div>

                            <p className="text-[11px] text-slate-500 font-medium">{q.slo}</p>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                              {q.options.map((opt, oIdx) => {
                                const isOptCorrect = oIdx === q.correct;
                                const isOptUserChoice = oIdx === userSel;

                                return (
                                  <div 
                                    key={oIdx}
                                    className={`p-2 rounded-lg border font-medium flex items-center justify-between ${
                                      isOptCorrect ? 'bg-emerald-100 border-emerald-300 text-emerald-900 font-bold' :
                                      isOptUserChoice ? 'bg-rose-100 border-rose-300 text-rose-900' : 'bg-white border-slate-200 text-slate-600'
                                    }`}
                                  >
                                    <span>{String.fromCharCode(65 + oIdx)}. {opt}</span>
                                    {isOptCorrect && <Icon name="check" className="w-3.5 h-3.5 text-emerald-700" />}
                                    {isOptUserChoice && !isOptCorrect && <Icon name="x" className="w-3.5 h-3.5 text-rose-700" />}
                                  </div>
                                );
                              })}
                            </div>

                            {/* Detailed Explanation & Why Incorrect Options are Wrong */}
                            <div className="bg-white/90 p-3 rounded-lg border border-slate-200 text-slate-700 leading-relaxed space-y-1.5">
                              <p className="text-slate-800">
                                <strong className="text-sky-900">Correct Answer Rationale: </strong> 
                                {q.explanation}
                              </p>

                              {!isCorrect && !isUnattempted && q.wrongExplanations && (
                                <div className="mt-2 pt-2 border-t border-slate-100 text-[11px] text-rose-900 bg-rose-50/60 p-2 rounded-md">
                                  <strong>Why option {String.fromCharCode(65 + userSel)} is incorrect: </strong>
                                  {q.wrongExplanations[userSel] || "This choice does not satisfy the scientific concept."}
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>

                {/* Restart Button */}
                <button
                  onClick={() => {
                    setIsSubmitted(false);
                    setQuizStarted(false);
                    setCurrentIdx(0);
                    setUserAnswers({});
                    setFlaggedQuestions({});
                    setTimeLeft(30 * 60);
                  }}
                  className="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-sky-600/25 transition-all flex items-center justify-center gap-2 text-sm no-print"
                >
                  <Icon name="rotate-ccw" className="w-5 h-5" />
                  <span>Restart Chapter 4 Assessment</span>
                </button>

              </div>
            </div>
          </div>
        );
      }

      const flaggedCount = Object.values(flaggedQuestions).filter(Boolean).length;

      return (
        <div className="min-h-screen py-6 px-4 sm:px-6 flex flex-col items-center">
          
          {/* Top Header Navigation Card */}
          <div className="max-w-3xl w-full bg-white rounded-2xl shadow-sm border border-sky-100 p-4 mb-4 space-y-3">
            
            {/* Academy Name & Class XI Badge */}
            <div className="flex justify-between items-center text-xs sm:text-sm font-bold text-sky-900">
              <span className="flex items-center gap-1.5 text-base sm:text-lg tracking-tight">
                🏔️ Qashqarian Academy
              </span>
              
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowNavGrid(!showNavGrid)}
                  className="px-2.5 py-1 bg-sky-50 hover:bg-sky-100 text-sky-800 rounded-lg text-xs font-semibold flex items-center gap-1.5 border border-sky-200 transition-all"
                >
                  <Icon name="grid" className="w-3.5 h-3.5" />
                  <span>Grid ({Object.keys(userAnswers).length}/{QUESTIONS.length})</span>
                </button>

                <span className="bg-sky-100 text-sky-800 px-2.5 py-1 rounded-lg font-bold text-xs">
                  Class: XI
                </span>
              </div>
            </div>

            {/* Question Counter (Q 1 / 30) & 30 Min Timer */}
            <div className="flex justify-between items-center text-xs font-semibold text-slate-600">
              <div className="flex items-center gap-3">
                <span className="text-sky-900 font-extrabold text-sm">Q {currentIdx + 1} / {QUESTIONS.length}</span>
                {flaggedCount > 0 && (
                  <span className="text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded text-[11px] font-bold flex items-center gap-1">
                    <Icon name="flag" className="w-3 h-3 text-amber-600" />
                    {flaggedCount} Flagged
                  </span>
                )}
              </div>

              <div className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg font-mono font-bold ${
                timeLeft < 300 ? 'bg-rose-100 text-rose-700 animate-pulse' : 'bg-sky-50 text-sky-800'
              }`}>
                <Icon name="clock" className="w-3.5 h-3.5" />
                <span>{formatTime(timeLeft)}</span>
              </div>
            </div>

            {/* Top Progress Bar */}
            <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
              <div 
                className="bg-sky-600 h-full transition-all duration-300"
                style={{ width: `${((currentIdx + 1) / QUESTIONS.length) * 100}%` }}
              />
            </div>
          </div>

          {/* Quick Navigator Grid Modal */}
          {showNavGrid && (
            <div className="max-w-3xl w-full bg-white rounded-2xl shadow-lg border border-sky-200 p-5 mb-4 animate-fadeIn space-y-3">
              <div className="flex justify-between items-center text-xs font-bold text-slate-800 border-b pb-2">
                <span>Question Quick Navigator Matrix</span>
                <button 
                  onClick={() => setShowNavGrid(false)}
                  className="text-slate-400 hover:text-slate-600"
                >
                  <Icon name="x" className="w-4 h-4" />
                </button>
              </div>

              <div className="grid grid-cols-5 sm:grid-cols-10 gap-2 max-h-52 overflow-y-auto p-1 custom-scrollbar">
                {QUESTIONS.map((_, idx) => {
                  const isAns = userAnswers.hasOwnProperty(idx);
                  const isCur = currentIdx === idx;
                  const isFlg = !!flaggedQuestions[idx];

                  let boxStyle = "bg-slate-100 text-slate-700 hover:bg-slate-200";
                  if (isCur) boxStyle = "bg-sky-600 text-white font-bold ring-2 ring-sky-500/50";
                  else if (isAns) boxStyle = "bg-emerald-100 text-emerald-900 font-semibold border border-emerald-300";

                  return (
                    <button
                      key={idx}
                      onClick={() => {
                        setCurrentIdx(idx);
                        setShowNavGrid(false);
                      }}
                      className={`h-8 rounded-lg text-xs transition-all relative flex items-center justify-center ${boxStyle}`}
                    >
                      {idx + 1}
                      {isFlg && (
                        <span className="absolute -top-1 -right-1 bg-amber-500 w-2.5 h-2.5 rounded-full border border-white" />
                      )}
                    </button>
                  );
                })}
              </div>

              <div className="flex gap-4 text-[10px] text-slate-500 pt-2 border-t justify-center">
                <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-300" /> Answered</span>
                <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-200" /> Unanswered</span>
                <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-sky-600" /> Current</span>
                <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-amber-500" /> Flagged</span>
              </div>
            </div>
          )}

          {/* Centered Main Question Card */}
          <div className="max-w-3xl w-full bg-white rounded-2xl shadow-lg border border-sky-100 p-6 sm:p-8 relative overflow-hidden flex flex-col min-h-[460px] justify-between">
            
            {/* Watermark in Center Background */}
            <div className="watermark-bg">
              <p className="text-5xl sm:text-6xl font-black text-sky-900 tracking-widest">
                🏔️ QASHQARIAN ACADEMY
              </p>
            </div>

            {/* Question Header & Options */}
            <div className="relative z-10 space-y-5">
              
              {/* SLO Tag above Question */}
              <div className="flex justify-between items-center gap-2">
                <div className="inline-block bg-sky-50 border border-sky-200 text-sky-900 text-xs font-bold px-3 py-1 rounded-full">
                  {currentQ.slo}
                </div>

                <button
                  onClick={() => toggleFlagQuestion(currentIdx)}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                    isCurrentFlagged 
                      ? 'bg-amber-100 text-amber-800 border border-amber-300' 
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                  title="Bookmark for review (Key: F)"
                >
                  <Icon name="flag" className={`w-3.5 h-3.5 ${isCurrentFlagged ? 'text-amber-600 fill-amber-500' : ''}`} />
                  <span>{isCurrentFlagged ? 'Flagged' : 'Flag'}</span>
                </button>
              </div>

              {/* Question Text */}
              <h2 className="text-base sm:text-lg font-bold text-slate-900 leading-snug">
                Q{currentIdx + 1}. {currentQ.question}
              </h2>

              {/* Multiple Choice Options (A, B, C, D) */}
              <div className="space-y-3 pt-2">
                {currentQ.options.map((optionText, optIdx) => {
                  const isSelected = selectedOption === optIdx;
                  const isCorrect = currentQ.correct === optIdx;

                  let btnStyle = "border-slate-200 hover:border-sky-300 hover:bg-sky-50/50 text-slate-800 bg-white";

                  if (isAnswered) {
                    if (quizMode === 'practice') {
                      if (isCorrect) {
                        btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-950 font-semibold ring-2 ring-emerald-500/20";
                      } else if (isSelected) {
                        btnStyle = "border-rose-500 bg-rose-50 text-rose-950 font-semibold ring-2 ring-rose-500/20";
                      } else {
                        btnStyle = "border-slate-200 opacity-60 bg-white text-slate-500";
                      }
                    } else {
                      // Blind Mode
                      if (isSelected) {
                        btnStyle = "border-sky-600 bg-sky-50 text-sky-950 font-semibold ring-2 ring-sky-500/20";
                      } else {
                        btnStyle = "border-slate-200 opacity-60 bg-white text-slate-500";
                      }
                    }
                  }

                  return (
                    <button
                      key={optIdx}
                      disabled={isAnswered}
                      onClick={() => handleSelectOption(optIdx)}
                      className={`w-full p-3.5 sm:p-4 rounded-xl border-2 text-left text-xs sm:text-sm transition-all flex items-center justify-between gap-3 ${btnStyle}`}
                    >
                      <div className="flex items-center gap-3">
                        <span className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shrink-0 ${
                          isSelected ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-700'
                        }`}>
                          {String.fromCharCode(65 + optIdx)}
                        </span>
                        <span>{optionText}</span>
                      </div>

                      {isAnswered && quizMode === 'practice' && (
                        <div>
                          {isCorrect && <Icon name="check" className="w-5 h-5 text-emerald-600" />}
                          {isSelected && !isCorrect && <Icon name="x" className="w-5 h-5 text-rose-600" />}
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>

              {/* Practice Mode Explanation Box */}
              {isAnswered && quizMode === 'practice' && (
                <div className={`mt-4 p-4 rounded-xl text-xs leading-relaxed space-y-1.5 animate-fadeIn border ${
                  selectedOption === currentQ.correct 
                    ? 'bg-emerald-50/90 border-emerald-200 text-emerald-950' 
                    : 'bg-rose-50/90 border-rose-200 text-rose-950'
                }`}>
                  <p className="font-bold flex items-center gap-1.5">
                    <Icon name="info" className="w-4 h-4" />
                    {selectedOption === currentQ.correct ? 'Correct Answer Rationale:' : 'Incorrect Answer Explanation:'}
                  </p>
                  <p className="text-slate-800">{currentQ.explanation}</p>
                  
                  {selectedOption !== currentQ.correct && currentQ.wrongExplanations && (
                    <p className="text-rose-900 font-medium pt-1 border-t border-rose-200/60">
                      <strong>Why option {String.fromCharCode(65 + selectedOption)} is wrong: </strong>
                      {currentQ.wrongExplanations[selectedOption]}
                    </p>
                  )}
                </div>
              )}
            </div>

            {/* Bottom Nav Controls (Previous / Next / Submit) */}
            <div className="relative z-10 pt-6 mt-6 border-t border-slate-100 flex justify-between items-center gap-4">
              <button
                disabled={currentIdx === 0}
                onClick={() => setCurrentIdx(prev => prev - 1)}
                className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5"
              >
                <Icon name="arrow-left" className="w-4 h-4" />
                Previous
              </button>

              <div className="flex gap-2">
                {currentIdx < QUESTIONS.length - 1 ? (
                  <button
                    onClick={() => setCurrentIdx(prev => prev + 1)}
                    className="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold shadow-md shadow-sky-600/20 transition-all flex items-center gap-1.5"
                  >
                    Next
                    <Icon name="arrow-right" className="w-4 h-4" />
                  </button>
                ) : (
                  <button
                    onClick={() => setIsSubmitted(true)}
                    className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-md shadow-emerald-600/20 transition-all flex items-center gap-1.5"
                  >
                    Submit Test
                    <Icon name="check" className="w-4 h-4" />
                  </button>
                )}
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
