    function App() {
      // Quiz Navigation & State Management
      const [quizStarted, setQuizStarted] = useState(false);
      const [quizMode, setQuizMode] = useState('practice'); // 'practice' or 'blind'
      const [currentIdx, setCurrentIdx] = useState(0);
      const [userAnswers, setUserAnswers] = useState({}); // { [qIdx]: selectedOptionIdx }
      const [timeLeft, setTimeLeft] = useState(5700); // 95 minutes = 5700 seconds
      const [isSubmitted, setIsSubmitted] = useState(false);

      // Timer Effect
      useEffect(() => {
        let timer = null;
        if (quizStarted && !isSubmitted && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                setIsSubmitted(true);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [quizStarted, isSubmitted, timeLeft]);

      // Format time string MM:SS or HH:MM:SS
      const formatTime = (secs) => {
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        if (h > 0) {
          return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      // Select Option & Lock Answer
      const handleSelectOption = (optionIdx) => {
        if (userAnswers.hasOwnProperty(currentIdx) || isSubmitted) return; // Answer locked
        setUserAnswers(prev => ({
          ...prev,
          [currentIdx]: optionIdx
        }));
      };

      // Scoring Calculations
      const scoreData = useMemo(() => {
        let correctCount = 0;
        let wrongCount = 0;
        let unattemptedCount = 0;

        QUESTIONS.forEach((q, idx) => {
          if (!userAnswers.hasOwnProperty(idx)) {
            unattemptedCount++;
          } else if (userAnswers[idx] === q.correct) {
            correctCount++;
          } else {
            wrongCount++;
          }
        });

        const grossMarks = correctCount * 1.0;
        const penalty = wrongCount * 0.25;
        const netMarks = Math.max(0, grossMarks - penalty);
        const maxMarks = QUESTIONS.length * 1.0;
        const percentage = Number(((netMarks / maxMarks) * 100).toFixed(1));

        return { correctCount, wrongCount, unattemptedCount, grossMarks, penalty, netMarks, maxMarks, percentage };
      }, [userAnswers]);

      // SLO Weak Area Analysis
      const sloAnalysis = useMemo(() => {
        const stats = {};
        QUESTIONS.forEach((q, idx) => {
          const sloKey = q.slo;
          if (!stats[sloKey]) {
            stats[sloKey] = { total: 0, correct: 0, wrong: 0, unattempted: 0 };
          }
          stats[sloKey].total++;
          if (!userAnswers.hasOwnProperty(idx)) {
            stats[sloKey].unattempted++;
          } else if (userAnswers[idx] === q.correct) {
            stats[sloKey].correct++;
          } else {
            stats[sloKey].wrong++;
          }
        });
        return stats;
      }, [userAnswers]);

      // Motivational Quote based on percentage
      const getMotivationalQuote = (pct) => {
        if (pct >= 85) return { quote: "Exceptional Excellence! Your understanding of Kingdom Animalia and body plans is outstanding.", author: "Qashqarian Academy Academic Board" };
        if (pct >= 70) return { quote: "Great Achievement! Review targeted SLO topics to turn your good score into perfection.", author: "Qashqarian Biology Faculty" };
        if (pct >= 50) return { quote: "Solid Conceptual Foundation! Analyze your incorrect attempts carefully to cement core invertebrate concepts.", author: "Biology Mentor Team" };
        return { quote: "Every error is an opportunity to learn. Study the detailed explanations and attempt again!", author: "Qashqarian Academy" };
      };

      // Current question reference
      const currentQ = QUESTIONS[currentIdx];
      const isAnswered = userAnswers.hasOwnProperty(currentIdx);
      const selectedOption = userAnswers[currentIdx];

      // START SCREEN
      if (!quizStarted) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 sm:p-6">
            <div className="max-w-2xl w-full bg-white rounded-2xl shadow-xl border border-sky-100 overflow-hidden animate-fadeIn">
              {/* Header Banner */}
              <div className="bg-gradient-to-r from-sky-700 via-sky-600 to-science-800 p-6 sm:p-8 text-white relative">
                <div className="flex justify-between items-center mb-3">
                  <span className="bg-sky-500/30 text-sky-100 text-xs font-bold px-3 py-1 rounded-full backdrop-blur-sm border border-sky-300/20">
                    🏔️ QASHQARIAN ACADEMY
                  </span>
                  <span className="text-xs font-semibold bg-white/10 px-2.5 py-1 rounded-md border border-white/20">
                    Class: XI Biology
                  </span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight">
                  Kingdom Animalia (Part-1)
                </h1>
                <p className="text-sky-100 text-sm mt-1">
                  SLO-Based Invertebrate Zoology Assessment (85 MCQs)
                </p>
              </div>

              {/* Instructions Content */}
              <div className="p-6 sm:p-8 space-y-6">
                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-sky-50 rounded-xl p-4 border border-sky-100 flex items-center gap-3">
                    <div className="p-2.5 bg-sky-600 text-white rounded-lg">
                      <Icon name="clock" className="w-5 h-5" />
                    </div>
                    <div>
                      <p className="text-xs text-slate-500 font-medium">Time Limit</p>
                      <p className="text-sm font-bold text-slate-800">85 Minutes</p>
                    </div>
                  </div>
                  <div className="bg-sky-50 rounded-xl p-4 border border-sky-100 flex items-center gap-3">
                    <div className="p-2.5 bg-sky-600 text-white rounded-lg">
                      <Icon name="award" className="w-5 h-5" />
                    </div>
                    <div>
                      <p className="text-xs text-slate-500 font-medium">Marking Scheme</p>
                      <p className="text-sm font-bold text-slate-800">+1.0 / -0.25</p>
                    </div>
                  </div>
                </div>

                {/* Mode Selector */}
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-3">
                    Select Test Mode:
                  </label>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button
                      type="button"
                      onClick={() => setQuizMode('practice')}
                      className={`p-4 rounded-xl text-left border-2 transition-all flex flex-col gap-1.5 ${
                        quizMode === 'practice'
                          ? 'border-sky-600 bg-sky-50/80 ring-2 ring-sky-500/20'
                          : 'border-slate-200 hover:border-sky-300 bg-white'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <span className="font-bold text-sm text-sky-900 flex items-center gap-1.5">
                          <Icon name="zap" className="w-4 h-4 text-sky-600" />
                          Practice Mode
                        </span>
                        {quizMode === 'practice' && <Icon name="check" className="w-4 h-4 text-sky-600" />}
                      </div>
                      <p className="text-xs text-slate-500 leading-relaxed">
                        Instant answer verification with scientific rationales immediately after locking your choice.
                      </p>
                    </button>

                    <button
                      type="button"
                      onClick={() => setQuizMode('blind')}
                      className={`p-4 rounded-xl text-left border-2 transition-all flex flex-col gap-1.5 ${
                        quizMode === 'blind'
                          ? 'border-sky-600 bg-sky-50/80 ring-2 ring-sky-500/20'
                          : 'border-slate-200 hover:border-sky-300 bg-white'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <span className="font-bold text-sm text-sky-900 flex items-center gap-1.5">
                          <Icon name="shield" className="w-4 h-4 text-sky-600" />
                          Exam / Blind Mode
                        </span>
                        {quizMode === 'blind' && <Icon name="check" className="w-4 h-4 text-sky-600" />}
                      </div>
                      <p className="text-xs text-slate-500 leading-relaxed">
                        Simulate real board exam conditions. Detailed solutions and marks revealed after test submission.
                      </p>
                    </button>
                  </div>
                </div>

                {/* Important Rules List */}
                <div className="bg-amber-50/80 border border-amber-200 rounded-xl p-4 text-xs text-amber-900 space-y-1.5">
                  <p className="font-bold text-amber-950 flex items-center gap-1.5">
                    <Icon name="alert-triangle" className="w-4 h-4 text-amber-600" />
                    Test Rules & Negative Marking Instructions:
                  </p>
                  <ul className="list-disc list-inside space-y-1 pl-1 text-amber-800">
                    <li>Selecting an option locks your response permanently for that question.</li>
                    <li>Incorrect choices incur a deduction of <strong>0.25 marks</strong>.</li>
                    <li>Unattempted questions carry zero penalty.</li>
                  </ul>
                </div>

                <button
                  onClick={() => setQuizStarted(true)}
                  className="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-sky-600/25 transition-all flex items-center justify-center gap-2 group"
                >
                  <span>Start Assessment</span>
                  <Icon name="arrow-right" className="w-5 h-5 group-hover:translate-x-1 transition-transform" />
                </button>
              </div>
            </div>
          </div>
        );
      }

      // FINAL RESULTS SCREEN
      if (isSubmitted) {
        const quoteObj = getMotivationalQuote(scoreData.percentage);

        return (
          <div className="min-h-screen py-8 px-4 sm:px-6 flex justify-center">
            <div className="max-w-4xl w-full bg-white rounded-2xl shadow-xl border border-sky-100 overflow-hidden animate-fadeIn space-y-6">
              
              {/* Header Banner */}
              <div className="bg-gradient-to-r from-sky-700 via-sky-600 to-science-800 p-6 sm:p-8 text-white relative">
                <div className="flex justify-between items-center mb-2">
                  <span className="text-xs font-bold bg-white/20 px-3 py-1 rounded-full">
                    🏔️ QASHQARIAN ACADEMY
                  </span>
                  <span className="text-xs font-semibold bg-white/10 px-2.5 py-1 rounded-md">
                    Class: XI Biology
                  </span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-extrabold">
                  Assessment Performance Summary
                </h1>
                <p className="text-sky-100 text-xs sm:text-sm mt-1">
                  Kingdom Animalia (Part-1) SLO Mock Test
                </p>
              </div>

              <div className="p-6 sm:p-8 space-y-8">
                
                {/* Motivational Quote Box */}
                <div className="bg-sky-50/80 border-l-4 border-sky-600 p-4 rounded-r-xl space-y-1">
                  <p className="text-sm font-semibold text-sky-950 italic">
                    "{quoteObj.quote}"
                  </p>
                  <p className="text-xs text-sky-700 font-bold">— {quoteObj.author}</p>
                </div>

                {/* Main Score Metrics */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                  <div className="bg-sky-50 border border-sky-100 rounded-xl p-4 text-center">
                    <p className="text-xs text-slate-500 font-semibold mb-1">Net Percentage</p>
                    <p className="text-3xl font-black text-sky-600">{scoreData.percentage}%</p>
                  </div>
                  <div className="bg-emerald-50 border border-emerald-100 rounded-xl p-4 text-center">
                    <p className="text-xs text-emerald-700 font-semibold mb-1">Correct Answers</p>
                    <p className="text-3xl font-black text-emerald-600">{scoreData.correctCount}</p>
                    <p className="text-[10px] text-emerald-600 font-medium">+{scoreData.grossMarks} Marks</p>
                  </div>
                  <div className="bg-rose-50 border border-rose-100 rounded-xl p-4 text-center">
                    <p className="text-xs text-rose-700 font-semibold mb-1">Wrong Answers</p>
                    <p className="text-3xl font-black text-rose-600">{scoreData.wrongCount}</p>
                    <p className="text-[10px] text-rose-600 font-medium">-{scoreData.penalty} Penalty</p>
                  </div>
                  <div className="bg-amber-50 border border-amber-100 rounded-xl p-4 text-center">
                    <p className="text-xs text-amber-700 font-semibold mb-1">Unattempted</p>
                    <p className="text-3xl font-black text-amber-600">{scoreData.unattemptedCount}</p>
                    <p className="text-[10px] text-amber-600 font-medium">0 Penalty</p>
                  </div>
                </div>

                {/* Net Marks Summary */}
                <div className="bg-slate-900 text-white rounded-xl p-4 flex justify-between items-center text-sm">
                  <span>Final Net Score:</span>
                  <span className="font-extrabold text-sky-400 text-base">
                    {scoreData.netMarks} / {scoreData.maxMarks} Marks
                  </span>
                </div>

                {/* Weak Area SLO Breakdown */}
                <div className="space-y-3">
                  <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                    <Icon name="bar-chart" className="w-5 h-5 text-sky-600" />
                    SLO Topic Mastery Analysis
                  </h3>

                  <div className="space-y-3 max-h-80 overflow-y-auto pr-2 custom-scrollbar">
                    {Object.entries(sloAnalysis).map(([slo, stats], idx) => {
                      const sloPct = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
                      return (
                        <div key={idx} className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs space-y-2">
                          <div className="flex justify-between items-start gap-2">
                            <span className="font-semibold text-slate-800">{slo}</span>
                            <span className={`font-bold px-2 py-0.5 rounded text-[11px] ${
                              sloPct >= 80 ? 'bg-emerald-100 text-emerald-800' :
                              sloPct >= 50 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'
                            }`}>
                              {sloPct}% Mastered
                            </span>
                          </div>
                          <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div 
                              className={`h-full transition-all duration-500 ${
                                sloPct >= 80 ? 'bg-emerald-500' : sloPct >= 50 ? 'bg-amber-500' : 'bg-rose-500'
                              }`}
                              style={{ width: `${sloPct}%` }}
                            />
                          </div>
                          <div className="flex gap-4 text-[11px] text-slate-500">
                            <span>Correct: {stats.correct}</span>
                            <span>Wrong: {stats.wrong}</span>
                            <span>Skipped: {stats.unattempted}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Detailed Analysis of Questions */}
                <div className="space-y-4">
                  <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                    <Icon name="book-open" className="w-5 h-5 text-sky-600" />
                    Detailed Answer Explanations & Corrections
                  </h3>

                  <div className="space-y-4 max-h-96 overflow-y-auto pr-2 custom-scrollbar">
                    {QUESTIONS.map((q, qIdx) => {
                      const userSel = userAnswers[qIdx];
                      const isCorrect = userSel === q.correct;
                      const isUnattempted = !userAnswers.hasOwnProperty(qIdx);

                      return (
                        <div 
                          key={q.id}
                          className={`p-4 rounded-xl border text-xs space-y-2.5 ${
                            isCorrect ? 'bg-emerald-50/50 border-emerald-200' :
                            isUnattempted ? 'bg-amber-50/50 border-amber-200' : 'bg-rose-50/50 border-rose-200'
                          }`}
                        >
                          <div className="flex justify-between items-start gap-2">
                            <span className="font-bold text-slate-900">
                              Q{qIdx + 1}. {q.question}
                            </span>
                            <span className={`px-2 py-0.5 rounded font-bold text-[10px] whitespace-nowrap ${
                              isCorrect ? 'bg-emerald-600 text-white' :
                              isUnattempted ? 'bg-amber-500 text-white' : 'bg-rose-600 text-white'
                            }`}>
                              {isCorrect ? 'CORRECT (+1.0)' : isUnattempted ? 'SKIPPED (0.0)' : 'WRONG (-0.25)'}
                            </span>
                          </div>

                          <p className="text-[11px] text-slate-500 font-medium">{q.slo}</p>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                            {q.options.map((opt, oIdx) => {
                              const isOptCorrect = oIdx === q.correct;
                              const isOptUserChoice = oIdx === userSel;

                              return (
                                <div 
                                  key={oIdx}
                                  className={`p-2 rounded-lg border font-medium flex items-center justify-between ${
                                    isOptCorrect ? 'bg-emerald-100 border-emerald-300 text-emerald-900 font-bold' :
                                    isOptUserChoice ? 'bg-rose-100 border-rose-300 text-rose-900' : 'bg-white border-slate-200 text-slate-600'
                                  }`}
                                >
                                  <span>{String.fromCharCode(65 + oIdx)}. {opt}</span>
                                  {isOptCorrect && <Icon name="check" className="w-3.5 h-3.5 text-emerald-700" />}
                                  {isOptUserChoice && !isOptCorrect && <Icon name="x" className="w-3.5 h-3.5 text-rose-700" />}
                                </div>
                              );
                            })}
                          </div>

                          <div className="bg-white/80 p-2.5 rounded-lg border border-slate-200 text-slate-700 leading-relaxed">
                            <span className="font-bold text-sky-900">Explanation: </span>
                            {q.explanation}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Restart Button */}
                <button
                  onClick={() => {
                    setIsSubmitted(false);
                    setQuizStarted(false);
                    setCurrentIdx(0);
                    setUserAnswers({});
                    setTimeLeft(5700);
                  }}
                  className="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-sky-600/25 transition-all flex items-center justify-center gap-2"
                >
                  <Icon name="rotate-ccw" className="w-5 h-5" />
                  <span>Restart Assessment</span>
                </button>

              </div>
            </div>
          </div>
        );
      }

      // ACTIVE QUIZ SCREEN
      return (
        <div className="min-h-screen py-6 px-4 sm:px-6 flex flex-col items-center">
          
          {/* Top Header Card */}
          <div className="max-w-3xl w-full bg-white rounded-2xl shadow-sm border border-sky-100 p-4 mb-4 space-y-3">
            
            {/* Academy Name Header */}
            <div className="flex justify-between items-center text-xs sm:text-sm font-bold text-sky-900">
              <span className="flex items-center gap-1.5">
                <span className="text-base">🏔️</span> Qashqarian Academy
              </span>
              <span className="bg-sky-100 text-sky-800 px-2.5 py-0.5 rounded-md font-semibold text-xs">
                Kingdom Animalia (Part-1)
              </span>
            </div>

            {/* Progress & Timer Bar */}
            <div className="flex justify-between items-center text-xs font-semibold text-slate-600">
              <span>Question {currentIdx + 1} / {QUESTIONS.length}</span>
              <div className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg font-mono font-bold ${
                timeLeft < 300 ? 'bg-rose-100 text-rose-700 animate-pulse' : 'bg-sky-50 text-sky-800'
              }`}>
                <Icon name="clock" className="w-3.5 h-3.5" />
                <span>{formatTime(timeLeft)}</span>
              </div>
            </div>

            {/* Visual Progress Bar */}
            <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
              <div 
                className="bg-sky-600 h-full transition-all duration-300"
                style={{ width: `${((currentIdx + 1) / QUESTIONS.length) * 100}%` }}
              />
            </div>
          </div>

          {/* Main Question Card Container */}
          <div className="max-w-3xl w-full bg-white rounded-2xl shadow-lg border border-sky-100 p-6 sm:p-8 relative overflow-hidden flex flex-col min-h-[460px] justify-between">
            
            {/* Watermark Logo */}
            <div className="watermark-bg">
              <p className="text-6xl font-black text-sky-900 tracking-widest">
                🏔️ QASHQARIAN ACADEMY
              </p>
            </div>

            {/* Question Content */}
            <div className="relative z-10 space-y-5">
              
              {/* SLO Badge */}
              <div className="inline-block bg-sky-50 border border-sky-200 text-sky-900 text-xs font-semibold px-3 py-1 rounded-full">
                {currentQ.slo}
              </div>

              {/* Question Statement */}
              <h2 className="text-base sm:text-lg font-bold text-slate-900 leading-snug">
                Q{currentIdx + 1}. {currentQ.question}
              </h2>

              {/* Multiple Choice Options */}
              <div className="space-y-3 pt-2">
                {currentQ.options.map((optionText, optIdx) => {
                  const isSelected = selectedOption === optIdx;
                  const isCorrect = currentQ.correct === optIdx;

                  let btnStyle = "border-slate-200 hover:border-sky-300 hover:bg-sky-50/50 text-slate-800 bg-white";

                  if (isAnswered) {
                    if (quizMode === 'practice') {
                      if (isCorrect) {
                        btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-950 font-semibold ring-2 ring-emerald-500/20";
                      } else if (isSelected) {
                        btnStyle = "border-rose-500 bg-rose-50 text-rose-950 font-semibold ring-2 ring-rose-500/20";
                      } else {
                        btnStyle = "border-slate-200 opacity-60 bg-white text-slate-500";
                      }
                    } else {
                      // Blind Mode: highlight locked selection neutral
                      if (isSelected) {
                        btnStyle = "border-sky-600 bg-sky-50 text-sky-950 font-semibold ring-2 ring-sky-500/20";
                      } else {
                        btnStyle = "border-slate-200 opacity-60 bg-white text-slate-500";
                      }
                    }
                  }

                  return (
                    <button
                      key={optIdx}
                      disabled={isAnswered}
                      onClick={() => handleSelectOption(optIdx)}
                      className={`w-full p-3.5 sm:p-4 rounded-xl border-2 text-left text-xs sm:text-sm transition-all flex items-center justify-between gap-3 ${btnStyle}`}
                    >
                      <div className="flex items-center gap-3">
                        <span className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shrink-0 ${
                          isSelected ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-700'
                        }`}>
                          {String.fromCharCode(65 + optIdx)}
                        </span>
                        <span>{optionText}</span>
                      </div>

                      {/* Status Icons for Practice Mode */}
                      {isAnswered && quizMode === 'practice' && (
                        <div>
                          {isCorrect && <Icon name="check" className="w-5 h-5 text-emerald-600" />}
                          {isSelected && !isCorrect && <Icon name="x" className="w-5 h-5 text-rose-600" />}
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>

              {/* Instant Practice Explanation Box */}
              {isAnswered && quizMode === 'practice' && (
                <div className="mt-4 p-4 rounded-xl bg-sky-50/90 border border-sky-200 text-xs text-sky-950 leading-relaxed space-y-1 animate-fadeIn">
                  <p className="font-bold text-sky-900 flex items-center gap-1.5">
                    <Icon name="info" className="w-4 h-4 text-sky-600" />
                    {selectedOption === currentQ.correct ? 'Correct Answer Explanation:' : 'Rationale & Explanation:'}
                  </p>
                  <p className="text-slate-700">{currentQ.explanation}</p>
                </div>
              )}
            </div>

            {/* Navigation Controls Footer */}
            <div className="relative z-10 pt-6 mt-6 border-t border-slate-100 flex justify-between items-center gap-4">
              <button
                disabled={currentIdx === 0}
                onClick={() => setCurrentIdx(prev => prev - 1)}
                className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5"
              >
                <Icon name="arrow-left" className="w-4 h-4" />
                Previous
              </button>

              <div className="flex gap-2">
                {currentIdx < QUESTIONS.length - 1 ? (
                  <button
                    onClick={() => setCurrentIdx(prev => prev + 1)}
                    className="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold shadow-md shadow-sky-600/20 transition-all flex items-center gap-1.5"
                  >
                    Next
                    <Icon name="arrow-right" className="w-4 h-4" />
                  </button>
                ) : (
                  <button
                    onClick={() => setIsSubmitted(true)}
                    className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-md shadow-emerald-600/20 transition-all flex items-center gap-1.5"
                  >
                    Submit Test
                    <Icon name="check" className="w-4 h-4" />
                  </button>
                )}
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
