        explanation: "Nucleoproteins are complexes formed by nucleic acids conjugated with proteins, such as DNA packaged with histones in chromatin."
      },
      {
        id: 44,
        slo: "SLO 2.8.2: Functions of Conjugated Molecules",
        question: "Glycolipids are components of the plasma membrane formed by joining carbohydrates to:",
        options: ["Amino acids", "Lipids", "Nucleic acids", "Mineral salts"],
        correct: 1,
        explanation: "Glycolipids consist of short carbohydrate chains bound to lipid molecules in the cell membrane."
      },
      {
        id: 45,
        slo: "SLO 2.8.2: Functions of Conjugated Molecules",
        question: "A patient gets a blood test showing high levels of low-density lipoproteins (LDL). Why are lipoproteins necessary for transporting cholesterol in human blood?",
        options: ["Cholesterol is non-polar and cannot dissolve directly in water-based blood", "Lipoproteins break cholesterol down into simple glucose molecules", "Blood cells cannot absorb cholesterol without digestive enzymes", "Cholesterol evaporates quickly if not attached to a nucleoprotein"],
        correct: 0,
        explanation: "Cholesterol is a hydrophobic, non-polar lipid. It cannot dissolve directly in aqueous plasma and must be carried inside amphipathic lipoproteins (like LDL and HDL)."
      }
    ];

    function App() {
      // Quiz State Management
      const [quizStarted, setQuizStarted] = useState(false);
      const [quizMode, setQuizMode] = useState('practice'); // 'practice' or 'blind'
      const [currentIdx, setCurrentIdx] = useState(0);
      const [userAnswers, setUserAnswers] = useState({}); // { [qIdx]: selectedOptionIdx }
      const [timeLeft, setTimeLeft] = useState(45 * 60); // 45 minutes = 2700 seconds
      const [isSubmitted, setIsSubmitted] = useState(false);

      // Timer Effect
      useEffect(() => {
        let timer = null;
        if (quizStarted && !isSubmitted && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                setIsSubmitted(true);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [quizStarted, isSubmitted, timeLeft]);

      // Format time string MM:SS or HH:MM:SS
      const formatTime = (secs) => {
        const hrs = Math.floor(secs / 3600);
        const mins = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        if (hrs > 0) {
          return `${hrs}:${mins.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        return `${mins.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      // Select Option & Lock Answer
      const handleSelectOption = (optionIdx) => {
        if (userAnswers.hasOwnProperty(currentIdx) || isSubmitted) return; // Answer locked
        setUserAnswers(prev => ({
          ...prev,
          [currentIdx]: optionIdx
        }));
      };

      // Scoring Calculations
      const scoreData = useMemo(() => {
        let correctCount = 0;
        let wrongCount = 0;
        let unattemptedCount = 0;

        QUESTIONS.forEach((q, idx) => {
          if (!userAnswers.hasOwnProperty(idx)) {
            unattemptedCount++;
          } else if (userAnswers[idx] === q.correct) {
            correctCount++;
          } else {
            wrongCount++;
          }
        });

        const grossMarks = correctCount * 1.0;
        const penalty = wrongCount * 0.25;
        const netMarks = Math.max(0, grossMarks - penalty);
        const maxMarks = QUESTIONS.length * 1.0;
        const percentage = Number(((netMarks / maxMarks) * 100).toFixed(1));

        return { correctCount, wrongCount, unattemptedCount, grossMarks, penalty, netMarks, maxMarks, percentage };
      }, [userAnswers]);

      // SLO Weak Area Analysis
      const sloAnalysis = useMemo(() => {
        const stats = {};
        QUESTIONS.forEach((q, idx) => {
          const sloKey = q.slo;
          if (!stats[sloKey]) {
            stats[sloKey] = { total: 0, correct: 0, wrong: 0, unattempted: 0 };
          }
          stats[sloKey].total++;
          if (!userAnswers.hasOwnProperty(idx)) {
            stats[sloKey].unattempted++;
          } else if (userAnswers[idx] === q.correct) {
            stats[sloKey].correct++;
          } else {
            stats[sloKey].wrong++;
          }
        });
        return stats;
      }, [userAnswers]);

      // Motivational Quotes based on percentage score
      const getMotivationalQuote = (pct) => {
        if (pct >= 85) return { quote: "Outstanding Mastery! Your grasp of nucleic acids, genetic codes, and conjugated molecules is exemplary.", author: "Qashqarian Academy Academic Council" };
        if (pct >= 70) return { quote: "Great Job! You have a solid understanding of molecular biology. Review targeted SLOs to hit 100%.", author: "Qashqarian Academy Faculty" };
        if (pct >= 50) return { quote: "Solid Progress! Carefully study the explanations for your incorrect answers to reinforce complex concepts.", author: "Department of Biology" };
        return { quote: "Every setback is a setup for a stronger comeback. Re-read Chapter 2 concepts and practice again!", author: "Qashqarian Mentorship Team" };
      };

      const currentQ = QUESTIONS[currentIdx];
      const isAnswered = userAnswers.hasOwnProperty(currentIdx);
      const selectedOption = userAnswers[currentIdx];

      // START SCREEN

                    Class: XI

                  Chapter 2: Biological Molecules

            </div>

                {/* Weak Area SLO Breakdown */}

                  <div className="space-y-3 max-h-80 overflow-y-auto pr-2 custom-scrollbar">

                      return (
                        <div key={idx} className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs space-y-2">

                              sloPct >= 50 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'
                            }`}>
                              {sloPct}% Mastered
                            </span>
                          </div>
                          <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div 
                              className={`h-full transition-all duration-500 ${
                                sloPct >= 80 ? 'bg-emerald-500' : sloPct >= 50 ? 'bg-amber-500' : 'bg-rose-500'
                              }`}
                              style={{ width: `${sloPct}%` }}
                            />
                          </div>
                          <div className="flex gap-4 text-[11px] text-slate-500">
                            <span>Correct: {stats.correct}</span>
                            <span>Wrong: {stats.wrong}</span>
                            <span>Skipped: {stats.unattempted}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Detailed Analysis of Wrong/Skipped MCQs */}
                <div className="space-y-4">
                  <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                    <Icon name="book-open" className="w-5 h-5 text-sky-600" />
                    Detailed Answer Rationales & Explanations
                  </h3>

                  <div className="space-y-4 max-h-96 overflow-y-auto pr-2 custom-scrollbar">
                    {QUESTIONS.map((q, qIdx) => {
                      const userSel = userAnswers[qIdx];
                      const isCorrect = userSel === q.correct;
                      const isUnattempted = !userAnswers.hasOwnProperty(qIdx);

                      return (
                        <div 
                          key={q.id}
                          className={`p-4 rounded-xl border text-xs space-y-2.5 ${
                            isCorrect ? 'bg-emerald-50/50 border-emerald-200' :
                            isUnattempted ? 'bg-amber-50/50 border-amber-200' : 'bg-rose-50/50 border-rose-200'
                          }`}
                        >
                          <div className="flex justify-between items-start gap-2">
                            <span className="font-bold text-slate-900">
                              Q{qIdx + 1}. {q.question}
                            </span>
                            <span className={`px-2 py-0.5 rounded font-bold text-[10px] whitespace-nowrap ${
                              isCorrect ? 'bg-emerald-600 text-white' :
                              isUnattempted ? 'bg-amber-500 text-white' : 'bg-rose-600 text-white'
                            }`}>
                              {isCorrect ? 'CORRECT (+1.0)' : isUnattempted ? 'SKIPPED (0.0)' : 'WRONG (-0.25)'}

                          <p className="text-[11px] text-slate-500 font-medium">{q.slo}</p>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">

                              const isOptUserChoice = oIdx === userSel;

                              return (
                                <div

                                  className={`p-2 rounded-lg border font-medium flex items-center justify-between ${
                                    isOptCorrect ? 'bg-emerald-100 border-emerald-300 text-emerald-900 font-bold' :
                                    isOptUserChoice ? 'bg-rose-100 border-rose-300 text-rose-900' : 'bg-white border-slate-200 text-slate-600'
                                  }`}
                                >
                                  <span>{String.fromCharCode(65 + oIdx)}. {opt}</span>
                                  {isOptCorrect && <Icon name="check" className="w-3.5 h-3.5 text-emerald-700" />}
                                  {isOptUserChoice && !isOptCorrect && <Icon name="x" className="w-3.5 h-3.5 text-rose-700" />}
                                </div>
                              );
                            })}
                          </div>

                          <div className="bg-white/80 p-2.5 rounded-lg border border-slate-200 text-slate-700 leading-relaxed">
                            <span className="font-bold text-sky-900">Explanation & Rationale: </span>
                            {q.explanation}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Restart Button */}
                <button
                  onClick={() => {
                    setIsSubmitted(false);
                    setQuizStarted(false);
                    setCurrentIdx(0);
                    setUserAnswers({});
                    setTimeLeft(45 * 60);
                  }}
                  className="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-sky-600/25 transition-all flex items-center justify-center gap-2"
                >
                  <Icon name="rotate-ccw" className="w-5 h-5" />
                  <span>Restart Assessment</span>
                </button>

              </div>
            </div>
          </div>
        );
      }

      // ACTIVE QUIZ SCREEN
      return (
        <div className="min-h-screen py-6 px-4 sm:px-6 flex flex-col items-center">
          
          {/* Top Navigation Header Card */}
          <div className="max-w-3xl w-full bg-white rounded-2xl shadow-sm border border-sky-100 p-4 mb-4 space-y-3">
            
            {/* Header Title & Class Name */}
            <div className="flex justify-between items-center text-xs sm:text-sm font-bold text-sky-900">
              <span className="flex items-center gap-1.5">
                <span className="text-base">🏔️</span> Qashqarian Academy
              </span>
              <span className="bg-sky-100 text-sky-800 px-2.5 py-0.5 rounded-md font-semibold text-xs">

              </span>

            <div className="flex justify-between items-center text-xs font-semibold text-slate-600">

              {/* Instant Practice Mode Explanation Box */}
              {isAnswered && quizMode === 'practice' && (
                <div className={`mt-4 p-4 rounded-xl text-xs leading-relaxed space-y-1 animate-fadeIn border ${
                  selectedOption === currentQ.correct 
                    ? 'bg-emerald-50/90 border-emerald-200 text-emerald-950' 
                    : 'bg-rose-50/90 border-rose-200 text-rose-950'
                }`}>
                  <p className="font-bold flex items-center gap-1.5">
                    <Icon name="info" className="w-4 h-4" />
                    {selectedOption === currentQ.correct ? 'Correct! Rationale:' : 'Incorrect Answer Explanation:'}
                  </p>
                  <p className="text-slate-800">{currentQ.explanation}</p>
                </div>
              )}
            </div>

            {/* Bottom Controls: Previous / Next / Submit Buttons */}
            <div className="relative z-10 pt-6 mt-6 border-t border-slate-100 flex justify-between items-center gap-4">
              <button
                disabled={currentIdx === 0}
                onClick={() => setCurrentIdx(prev => prev - 1)}
                className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5"
              >
                <Icon name="arrow-left" className="w-4 h-4" />
                Previous
              </button>

              <div className="flex gap-2">
                {currentIdx < QUESTIONS.length - 1 ? (
                  <button
                    onClick={() => setCurrentIdx(prev => prev + 1)}
                    className="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold shadow-md shadow-sky-600/20 transition-all flex items-center gap-1.5"
                  >
                    Next
                    <Icon name="arrow-right" className="w-4 h-4" />
                  </button>
                ) : (
                  <button
                    onClick={() => setIsSubmitted(true)}
                    className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-md shadow-emerald-600/20 transition-all flex items-center gap-1.5"
                  >
                    Submit Test
                    <Icon name="check" className="w-4 h-4" />
                  </button>
                )}
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
