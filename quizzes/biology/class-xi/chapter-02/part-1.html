                  </div>
                </div>

                {/* Detailed Analysis of Wrong/Skipped MCQs */}
                <div className="space-y-4">
                  <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                    <Icon name="book-open" className="w-5 h-5 text-sky-600" />
                    Detailed Answer Rationales & Corrections
                  </h3>

                  <div className="space-y-4 max-h-96 overflow-y-auto pr-2 custom-scrollbar">
                    {QUESTIONS.map((q, qIdx) => {
                      const userSel = userAnswers[qIdx];
                      const isCorrect = userSel === q.correct;
                      const isUnattempted = !userAnswers.hasOwnProperty(qIdx);

                      return (
                        <div 
                          key={q.id}
                          className={`p-4 rounded-xl border text-xs space-y-2.5 ${
                            isCorrect ? 'bg-emerald-50/50 border-emerald-200' :
                            isUnattempted ? 'bg-amber-50/50 border-amber-200' : 'bg-rose-50/50 border-rose-200'
                          }`}
                        >
                          <div className="flex justify-between items-start gap-2">
                            <span className="font-bold text-slate-900">
                              Q{qIdx + 1}. {q.question}
                            </span>
                            <span className={`px-2 py-0.5 rounded font-bold text-[10px] whitespace-nowrap ${
                              isCorrect ? 'bg-emerald-600 text-white' :
                              isUnattempted ? 'bg-amber-500 text-white' : 'bg-rose-600 text-white'
                            }`}>
                              {isCorrect ? 'CORRECT (+1.0)' : isUnattempted ? 'SKIPPED (0.0)' : 'WRONG (-0.25)'}
                            </span>
                          </div>

                          <p className="text-[11px] text-slate-500 font-medium">{q.slo}</p>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                            {q.options.map((opt, oIdx) => {
                              const isOptCorrect = oIdx === q.correct;
                              const isOptUserChoice = oIdx === userSel;

                              return (
                                <div 
                                  key={oIdx}
                                  className={`p-2 rounded-lg border font-medium flex items-center justify-between ${
                                    isOptCorrect ? 'bg-emerald-100 border-emerald-300 text-emerald-900 font-bold' :
                                    isOptUserChoice ? 'bg-rose-100 border-rose-300 text-rose-900' : 'bg-white border-slate-200 text-slate-600'
                                  }`}
                                >
                                  <span>{String.fromCharCode(65 + oIdx)}. {opt}</span>
                                  {isOptCorrect && <Icon name="check" className="w-3.5 h-3.5 text-emerald-700" />}
                                  {isOptUserChoice && !isOptCorrect && <Icon name="x" className="w-3.5 h-3.5 text-rose-700" />}
                                </div>
                              );
                            })}
                          </div>

                          <div className="bg-white/80 p-2.5 rounded-lg border border-slate-200 text-slate-700 leading-relaxed">
                            <span className="font-bold text-sky-900">Explanation: </span>
                            {q.explanation}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Restart Button */}
                <button
                  onClick={() => {
                    setIsSubmitted(false);
                    setQuizStarted(false);
                    setCurrentIdx(0);
                    setUserAnswers({});
                    setTimeLeft(3600);
                  }}
                  className="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-sky-600/25 transition-all flex items-center justify-center gap-2"
                >
                  <Icon name="rotate-ccw" className="w-5 h-5" />
                  <span>Restart Assessment</span>
                </button>

              </div>
            </div>
          </div>
        );
      }

      // ACTIVE QUIZ SCREEN
      return (
        <div className="min-h-screen py-6 px-4 sm:px-6 flex flex-col items-center">
          
          {/* Top Header Card */}
          <div className="max-w-3xl w-full bg-white rounded-2xl shadow-sm border border-sky-100 p-4 mb-4 space-y-3">
            
            {/* Academy Name Header */}
            <div className="flex justify-between items-center text-xs sm:text-sm font-bold text-sky-900">
              <span className="flex items-center gap-1.5">
                <span className="text-base">🏔️</span> Qashqarian Academy
              </span>
              <span className="bg-sky-100 text-sky-800 px-2.5 py-0.5 rounded-md font-semibold text-xs">
                Class: XI
              </span>
            </div>

            {/* Progress & Timer Bar */}
            <div className="flex justify-between items-center text-xs font-semibold text-slate-600">
              <span>Question {currentIdx + 1} / {QUESTIONS.length}</span>
              <div className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg font-mono font-bold ${
                timeLeft < 300 ? 'bg-rose-100 text-rose-700 animate-pulse' : 'bg-sky-50 text-sky-800'
              }`}>
                <Icon name="clock" className="w-3.5 h-3.5" />
                <span>{formatTime(timeLeft)}</span>
              </div>
            </div>

            {/* Visual Progress Bar */}
            <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
              <div 
                className="bg-sky-600 h-full transition-all duration-300"
                style={{ width: `${((currentIdx + 1) / QUESTIONS.length) * 100}%` }}
              />
            </div>
          </div>

          {/* Main Question Card Container */}
          <div className="max-w-3xl w-full bg-white rounded-2xl shadow-lg border border-sky-100 p-6 sm:p-8 relative overflow-hidden flex flex-col min-h-[460px] justify-between">
            
            {/* Watermark Logo */}
            <div className="watermark-bg">
              <p className="text-6xl font-black text-sky-900 tracking-widest">
                🏔️ QASHQARIAN ACADEMY
              </p>
            </div>

            {/* Question Content */}
            <div className="relative z-10 space-y-5">
              
              {/* SLO Badge */}
              <div className="inline-block bg-sky-50 border border-sky-200 text-sky-900 text-xs font-semibold px-3 py-1 rounded-full">
                {currentQ.slo}
              </div>

              {/* Question Statement */}
              <h2 className="text-base sm:text-lg font-bold text-slate-900 leading-snug">
                Q{currentIdx + 1}. {currentQ.question}
              </h2>

              {/* Multiple Choice Options */}
              <div className="space-y-3 pt-2">
                {currentQ.options.map((optionText, optIdx) => {
                  const isSelected = selectedOption === optIdx;
                  const isCorrect = currentQ.correct === optIdx;

                  let btnStyle = "border-slate-200 hover:border-sky-300 hover:bg-sky-50/50 text-slate-800 bg-white";

                  if (isAnswered) {
                    if (quizMode === 'practice') {
                      if (isCorrect) {
                        btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-950 font-semibold ring-2 ring-emerald-500/20";
                      } else if (isSelected) {
                        btnStyle = "border-rose-500 bg-rose-50 text-rose-950 font-semibold ring-2 ring-rose-500/20";
                      } else {
                        btnStyle = "border-slate-200 opacity-60 bg-white text-slate-500";
                      }
                    } else {
                      // Blind Mode: highlight locked selection neutral
                      if (isSelected) {
                        btnStyle = "border-sky-600 bg-sky-50 text-sky-950 font-semibold ring-2 ring-sky-500/20";
                      } else {
                        btnStyle = "border-slate-200 opacity-60 bg-white text-slate-500";
                      }
                    }
                  }

                  return (
                    <button
                      key={optIdx}
                      disabled={isAnswered}
                      onClick={() => handleSelectOption(optIdx)}
                      className={`w-full p-3.5 sm:p-4 rounded-xl border-2 text-left text-xs sm:text-sm transition-all flex items-center justify-between gap-3 ${btnStyle}`}
                    >
                      <div className="flex items-center gap-3">
                        <span className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shrink-0 ${
                          isSelected ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-700'
                        }`}>
                          {String.fromCharCode(65 + optIdx)}
                        </span>
                        <span>{optionText}</span>
                      </div>

                      {/* Status Icons for Practice Mode */}
                      {isAnswered && quizMode === 'practice' && (
                        <div>
                          {isCorrect && <Icon name="check" className="w-5 h-5 text-emerald-600" />}
                          {isSelected && !isCorrect && <Icon name="x" className="w-5 h-5 text-rose-600" />}
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>

              {/* Instant Practice Explanation Box */}
              {isAnswered && quizMode === 'practice' && (
                <div className="mt-4 p-4 rounded-xl bg-sky-50/90 border border-sky-200 text-xs text-sky-950 leading-relaxed space-y-1 animate-fadeIn">
                  <p className="font-bold text-sky-900 flex items-center gap-1.5">
                    <Icon name="info" className="w-4 h-4 text-sky-600" />
                    {selectedOption === currentQ.correct ? 'Correct Answer Explanation:' : 'Rationale & Explanation:'}
                  </p>
                  <p className="text-slate-700">{currentQ.explanation}</p>
                </div>
              )}
            </div>

            {/* Navigation Controls Footer */}
            <div className="relative z-10 pt-6 mt-6 border-t border-slate-100 flex justify-between items-center gap-4">
              <button
                disabled={currentIdx === 0}
                onClick={() => setCurrentIdx(prev => prev - 1)}
                className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5"
              >
                <Icon name="arrow-left" className="w-4 h-4" />
                Previous
              </button>

              <div className="flex gap-2">
                {currentIdx < QUESTIONS.length - 1 ? (
                  <button
                    onClick={() => setCurrentIdx(prev => prev + 1)}
                    className="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold shadow-md shadow-sky-600/20 transition-all flex items-center gap-1.5"
                  >
                    Next
                    <Icon name="arrow-right" className="w-4 h-4" />
                  </button>
                ) : (
                  <button
                    onClick={() => setIsSubmitted(true)}
                    className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-md shadow-emerald-600/20 transition-all flex items-center gap-1.5"
                  >
                    Submit Test
                    <Icon name="check" className="w-4 h-4" />
                  </button>
                )}
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
