    function App() {
      const [screen, setScreen] = useState('welcome'); // 'welcome' | 'quiz' | 'results'
      const [quizMode, setQuizMode] = useState('practice'); // 'practice' | 'blind'
      const [currentIndex, setCurrentIndex] = useState(0);
      
      // Track user answers (null if unanswered)
      const [userAnswers, setUserAnswers] = useState(Array(QUIZ_DATA.length).fill(null));
      
      // Timer: 24 minutes = 1440 seconds
      const TOTAL_TIME = 24 * 60;
      const [timeLeft, setTimeLeft] = useState(TOTAL_TIME);
      const [timerActive, setTimerActive] = useState(false);
      
      // Results view filter
      const [filterReview, setFilterReview] = useState('all'); // 'all' | 'wrong' | 'correct' | 'unanswered'

      useEffect(() => {
        let timer = null;
        if (timerActive && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft((prev) => {
              if (prev <= 1) {
                clearInterval(timer);
                handleFinishQuiz();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => {
          if (timer) clearInterval(timer);
        };
      }, [timerActive, timeLeft]);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const handleStartQuiz = (mode) => {
        setQuizMode(mode);
        setScreen('quiz');
        setCurrentIndex(0);
        setUserAnswers(Array(QUIZ_DATA.length).fill(null));
        setTimeLeft(TOTAL_TIME);
        setTimerActive(true);
      };

      // Locked selection logic
      const handleOptionSelect = (optionIdx) => {
        if (userAnswers[currentIndex] !== null) return; // Answer locked!
        const updated = [...userAnswers];
        updated[currentIndex] = optionIdx;
        setUserAnswers(updated);
      };

      const handleFinishQuiz = () => {
        setTimerActive(false);
        setScreen('results');
      };

      const analytics = useMemo(() => {
        let correctCount = 0;
        let wrongCount = 0;
        let unansweredCount = 0;

        const sloStats = {};

        QUIZ_DATA.forEach((q, idx) => {
          const uAns = userAnswers[idx];
          
          if (!sloStats[q.sloCode]) {
            sloStats[q.sloCode] = { desc: q.sloDesc, total: 0, correct: 0, wrong: 0 };
          }
          sloStats[q.sloCode].total += 1;

          if (uAns === null) {
            unansweredCount += 1;
          } else if (uAns === q.correctAnswer) {
            correctCount += 1;
            sloStats[q.sloCode].correct += 1;
          } else {
            wrongCount += 1;
            sloStats[q.sloCode].wrong += 1;
          }
        });

        // -0.25 negative marking calculation
        const rawScore = correctCount * 1.0 - wrongCount * 0.25;
        const maxScore = QUIZ_DATA.length * 1.0;
        const netScore = Math.max(0, rawScore);
        const percentage = Math.max(0, Math.round((netScore / maxScore) * 100));

        const timeSpentSeconds = TOTAL_TIME - timeLeft;

                              : isUnanswered
                              ? 'bg-amber-50/40 border-amber-200'
                              : 'bg-rose-50/40 border-rose-200'
                          }`}
                        >
                          <div className="flex items-center justify-between gap-2 mb-2">
                            <span className="text-[10px] font-bold text-sky-800 uppercase bg-sky-100 px-2 py-0.5 rounded border border-sky-200">
                              Q{originalIdx + 1} • {q.sloCode}
                            </span>

                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider ${
                              isCorrect
                                ? 'bg-emerald-100 text-emerald-800 border border-emerald-300'
                                : isUnanswered
                                ? 'bg-amber-100 text-amber-800 border border-amber-300'
                                : 'bg-rose-100 text-rose-800 border border-rose-300'
                            }`}>
                              {isCorrect ? '✓ Correct (+1.0)' : isUnanswered ? '⚪ Skipped (0.0)' : '✗ Incorrect (-0.25)'}
                            </span>
                          </div>

                          <h4 className="text-xs md:text-sm font-bold text-slate-900 mb-2">
                            {q.question}
                          </h4>

                          {/* Options Grid */}
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs mb-2.5">
                            {q.options.map((opt, oIdx) => {
                              const isCorrectOpt = oIdx === q.correctAnswer;
                              const isUserPick = uAns === oIdx;

                              let optStyle = "bg-white border-slate-200 text-slate-700";
                              if (isCorrectOpt) optStyle = "bg-emerald-100 border-emerald-400 text-emerald-950 font-bold";
                              else if (isUserPick) optStyle = "bg-rose-100 border-rose-400 text-rose-950 font-bold";

                              return (
                                <div key={oIdx} className={`p-2 rounded-xl border flex items-start space-x-1.5 ${optStyle}`}>
                                  <span className="font-mono font-bold text-[11px]">{String.fromCharCode(65 + oIdx)}.</span>
                                  <span className="text-[11px] leading-tight">{opt}</span>
                                </div>
                              );
                            })}
                          </div>

                          {/* Explanation Box */}
                          <div className="p-3 bg-white rounded-xl border border-slate-200 text-xs text-slate-700 leading-relaxed space-y-1">
                            <div>
                              <strong className="text-sky-900 block font-bold">Scientific Rationale:</strong>
                              {q.explanation}
                            </div>

                            {!isCorrect && !isUnanswered && (
                              <div className="pt-1.5 border-t border-slate-100 text-rose-900">
                                <strong className="text-rose-950 block font-bold">Why Option {String.fromCharCode(65 + uAns)} is wrong:</strong>
                                {q.wrongExplanations[uAns]}
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                </div>

              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="border-t border-sky-100 bg-white/70 py-3 text-center text-xs text-slate-500 z-10">
            <p>© Qashqarian Academy • Class XI Biology Assessment Engine</p>
          </footer>

        </div>
      );
    }

    // Mount React Root
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
