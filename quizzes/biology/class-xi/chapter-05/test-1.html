                  <div className="space-y-3">
                    {currentQ.options.map((opt, idx) => {
                      const letter = String.fromCharCode(65 + idx);
                      const isSelected = selectedOption === idx;
                      const isCorrect = idx === currentQ.correct;

                      let btnStyle = "border-slate-200 bg-white hover:border-sky-300 hover:bg-sky-50/50 text-slate-700";
                      let badgeStyle = "bg-slate-100 text-slate-600 group-hover:bg-sky-100 group-hover:text-sky-700";

                      if (isAnswered) {
                        if (mode === 'practice') {
                          if (isCorrect) {
                            btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-950 font-semibold ring-2 ring-emerald-400/20";
                            badgeStyle = "bg-emerald-600 text-white";
                          } else if (isSelected) {
                            btnStyle = "border-rose-400 bg-rose-50 text-rose-950 ring-2 ring-rose-400/20";
                            badgeStyle = "bg-rose-600 text-white";
                          } else {
                            btnStyle = "border-slate-200 opacity-50 bg-slate-50 text-slate-500";
                            badgeStyle = "bg-slate-200 text-slate-400";
                          }
                        } else {
                          // Blind mode: just highlight selected
                          if (isSelected) {
                            btnStyle = "border-sky-600 bg-sky-50 text-sky-950 font-semibold ring-2 ring-sky-500/20";
                            badgeStyle = "bg-sky-600 text-white";
                          } else {
                            btnStyle = "border-slate-200 opacity-60 bg-white text-slate-600";
                            badgeStyle = "bg-slate-100 text-slate-500";
                          }
                        }
                      }

                      return (
                        <button
                          key={idx}
                          onClick={() => handleOptionSelect(idx)}
                          disabled={isAnswered}
                          className={`w-full p-4 rounded-xl border-2 text-left transition-all duration-150 flex items-center justify-between group ${btnStyle}`}
                        >
                          <div className="flex items-center space-x-3.5 pr-2">
                            <span className={`w-8 h-8 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 transition-colors ${badgeStyle}`}>
                              {letter}
                            </span>
                            <span className="text-sm md:text-base leading-relaxed">
                              {opt}
                            </span>
                          </div>

                          {/* Status Icons for Practice Mode */}
                          {mode === 'practice' && isAnswered && (
                            <div className="shrink-0 ml-2">
                              {isCorrect && (
                                <span className="w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-sm">
                                  <Icon name="check" className="w-4 h-4" />
                                </span>
                              )}
                              {isSelected && !isCorrect && (
                                <span className="w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-sm">
                                  <Icon name="x" className="w-4 h-4" />
                                </span>
                              )}
                            </div>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {/* PRACTICE MODE EXPLANATION BOX */}
                  {mode === 'practice' && isAnswered && (
                    <div className="mt-6 p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs md:text-sm animate-fadeIn">
                      <div className="flex items-center gap-2 mb-2 font-bold text-slate-800">
                        <Icon name="info" className="w-4 h-4 text-sky-600" />
                        <span>Explanation Rationale:</span>
                      </div>
                      <p className="text-slate-700 leading-relaxed mb-3">
                        <strong className="text-emerald-700">Correct Choice: </strong>
                        {currentQ.explanation}
                      </p>

                      {selectedOption !== currentQ.correct && (
                        <div className="p-3 rounded-lg bg-rose-50/80 border border-rose-200 text-rose-900 mt-2">
                          <span className="font-bold text-rose-700">Why option {String.fromCharCode(65 + selectedOption)} is incorrect: </span>
                          <span>{currentQ.wrongExplanations[selectedOption > currentQ.correct ? selectedOption - 1 : selectedOption]}</span>
                        </div>
                      )}
                    </div>
                  )}

                  {/* NAV CONTROLS */}
                  <div className="mt-8 pt-4 border-t border-slate-100 flex items-center justify-between">
                    <button
                      onClick={handlePrev}
                      disabled={currentIndex === 0}
                      className={`px-4 py-2.5 rounded-xl border font-bold text-xs md:text-sm flex items-center gap-2 transition-all ${
                        currentIndex === 0
                          ? 'border-slate-200 text-slate-300 cursor-not-allowed'
                          : 'border-slate-300 text-slate-700 hover:bg-slate-50 hover:border-slate-400'
                      }`}
                    >
                      <Icon name="arrow-left" className="w-4 h-4" /> Previous
                    </button>

                    <div className="flex items-center gap-2">
                      {currentIndex === QUESTIONS.length - 1 ? (
                        <button
                          onClick={handleFinishQuiz}
                          className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold text-xs md:text-sm shadow-md hover:shadow-lg transition-all flex items-center gap-2"
                        >
                          <Icon name="award" className="w-4 h-4" /> Submit Test
                        </button>
                      ) : (
                        <button
                          onClick={handleNext}
                          className="px-6 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs md:text-sm shadow-md hover:shadow-lg transition-all flex items-center gap-2"
                        >
                          Next <Icon name="arrow-right" className="w-4 h-4" />
                        </button>
                      )}
                    </div>
                  </div>

                </div>

                {/* Quick Question Jump Grid */}
                <div className="mt-6 bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                  <div className="flex items-center justify-between mb-3 text-xs font-bold text-slate-600">
                    <span className="flex items-center gap-1.5">
                      <Icon name="grid" className="w-4 h-4 text-sky-600" /> Palette Navigation
                    </span>
                    <span>{Object.keys(userAnswers).length} / {QUESTIONS.length} Answered</span>
                  </div>
                  <div className="grid grid-cols-10 sm:grid-cols-16 md:grid-cols-20 gap-1.5 max-h-36 overflow-y-auto custom-scrollbar p-1">
                    {QUESTIONS.map((q, idx) => {
                      const ans = userAnswers[q.id];
                      const isCurrent = idx === currentIndex;
                      let bg = "bg-slate-100 text-slate-600 border-slate-200";

                      if (ans !== undefined) {
                        bg = "bg-sky-600 text-white border-sky-600";
                      }

                      return (
                        <button
                          key={q.id}
                          onClick={() => setCurrentIndex(idx)}
                          className={`h-7 rounded text-[11px] font-bold border transition-all ${bg} ${
                            isCurrent ? 'ring-2 ring-sky-400 ring-offset-1 font-black scale-105' : ''
                          }`}
                        >
                          {idx + 1}
                        </button>
                      );
                    })}
                  </div>
                </div>

              </div>
            )}

            {/* 3. FINAL RESULTS SCREEN */}
            {screen === 'results' && (
              <div className="space-y-6 animate-fadeIn pb-12">
                
                {/* Result Hero Header */}
                <div className="bg-white rounded-2xl p-6 md:p-8 shadow-xl border border-sky-100 text-center relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-sky-500 via-teal-500 to-indigo-500"></div>

                  <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-sky-50 text-sky-600 text-3xl mb-3 shadow-inner">
                    🏔️
                  </div>
                  <h2 className="text-2xl md:text-3xl font-black text-slate-900">
                    Evaluation & Diagnostic Summary
                  </h2>
                  <p className="text-xs font-bold text-sky-700 tracking-wider uppercase mt-1">
                    Qashqarian Academy • Class XI Biology Chapter 5
                  </p>

                  {/* Motivational Quote Banner */}
                  <div className="mt-4 p-4 rounded-xl bg-sky-50/80 border border-sky-200 text-sky-900 text-xs md:text-sm font-medium italic max-w-2xl mx-auto">
                    "{motivationalQuote}"
                  </div>

                  {/* Primary Score Grid */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 md:gap-4 mt-6">
                    
                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                      <span className="text-xs font-bold text-slate-400 uppercase">Net Score</span>
                      <div className="text-2xl md:text-3xl font-black text-slate-800 mt-1">
                        {scoreData.rawMarks} <span className="text-xs text-slate-400 font-normal">/ {scoreData.maxMarks}</span>
                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-sky-50 border border-sky-200">
                      <span className="text-xs font-bold text-sky-600 uppercase">Percentage</span>
                      <div className="text-2xl md:text-3xl font-black text-sky-700 mt-1">
                        {scoreData.netPercentage}%
                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-emerald-50 border border-emerald-200">
                      <span className="text-xs font-bold text-emerald-600 uppercase">Correct (+1)</span>
                      <div className="text-2xl md:text-3xl font-black text-emerald-700 mt-1">
                        {scoreData.correctCount}
                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-rose-50 border border-rose-200">
                      <span className="text-xs font-bold text-rose-600 uppercase">Wrong (-0.25)</span>
                      <div className="text-2xl md:text-3xl font-black text-rose-700 mt-1">
                        {scoreData.wrongCount}
                      </div>
                    </div>

                  </div>

                  {/* Actions */}
                  <div className="mt-6 flex flex-wrap items-center justify-center gap-3 no-print">
                    <button
                      onClick={handleRestart}
                      className="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs md:text-sm shadow-md transition-all flex items-center gap-2"
                    >
                      <Icon name="rotate-ccw" className="w-4 h-4" /> Retake Test
                    </button>
                    <button
                      onClick={() => window.print()}
                      className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs md:text-sm shadow-md transition-all flex items-center gap-2"
                    >
                      <Icon name="printer" className="w-4 h-4" /> Print Report
                    </button>
                  </div>
                </div>

                {/* SLO WEAK AREA ANALYSIS */}
                <div className="bg-white rounded-2xl p-6 shadow-xl border border-sky-100">
                  <h3 className="text-base md:text-lg font-extrabold text-slate-900 mb-1 flex items-center gap-2">
                    <Icon name="bar-chart" className="w-5 h-5 text-sky-600" /> SLO Performance & Weak Area Analysis
                  </h3>
                  <p className="text-xs text-slate-500 mb-4">
                    Detailed diagnostic breakdown by Student Learning Outcomes (SLOs) to pinpoint topics needing further revision.
                  </p>

                  <div className="space-y-4">
                    {Object.entries(scoreData.sloStats).map(([sloName, stats]) => {
                      const sloPct = stats.total > 0 ? ((stats.correct / stats.total) * 100).toFixed(0) : 0;
                      let barColor = "bg-emerald-500";
                      let textColor = "text-emerald-700";

                      if (sloPct < 50) {
                        barColor = "bg-rose-500";
                        textColor = "text-rose-700";
                      } else if (sloPct < 75) {
                        barColor = "bg-amber-500";
                        textColor = "text-amber-700";
                      }

                      return (
                        <div key={sloName} className="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between text-xs font-bold gap-1 mb-2">
                            <span className="text-slate-800">{sloName}</span>
                            <span className={`${textColor} font-mono`}>
                              {stats.correct} / {stats.total} Correct ({sloPct}%)
                            </span>
                          </div>
                          <div className="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                            <div className={`h-2 rounded-full transition-all duration-500 ${barColor}`} style={{ width: `${sloPct}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* QUESTION REVIEW SECTION */}
                <div className="bg-white rounded-2xl p-6 shadow-xl border border-sky-100">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-100 pb-4 mb-6 gap-3">
                    <div>
                      <h3 className="text-base md:text-lg font-extrabold text-slate-900 flex items-center gap-2">
                        <Icon name="book-open" className="w-5 h-5 text-sky-600" /> Question-by-Question Review
                      </h3>
                      <p className="text-xs text-slate-500">
                        Review your answers, correct options, and comprehensive rationales.
                      </p>
                    </div>

                    {/* Filter Tabs */}
                    <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl text-xs font-bold self-start no-print">
                      {['all', 'wrong', 'correct', 'unanswered'].map(f => (
                        <button
                          key={f}
                          onClick={() => setFilterReview(f)}
                          className={`px-3 py-1.5 rounded-lg capitalize transition-all ${
                            filterReview === f ? 'bg-white text-sky-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'
                          }`}
                        >
                          {f}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Questions List */}
                  <div className="space-y-6">
                    {QUESTIONS.filter(q => {
                      const userAns = userAnswers[q.id];
                      if (filterReview === 'wrong') return userAns !== undefined && userAns !== q.correct;
                      if (filterReview === 'correct') return userAns === q.correct;
                      if (filterReview === 'unanswered') return userAns === undefined;
                      return true;
                    }).map((q) => {
                      const userAns = userAnswers[q.id];
                      const isUnanswered = userAns === undefined;
                      const isCorrect = userAns === q.correct;

                      return (
                        <div key={q.id} className="p-4 md:p-5 rounded-xl border border-slate-200 bg-slate-50/50 space-y-3">
                          
                          {/* Top Tag & Status */}
                          <div className="flex items-center justify-between text-xs">
                            <span className="font-bold text-sky-800 bg-sky-100 px-2.5 py-1 rounded-md">
                              Q{q.id} • {q.slo}
                            </span>
                            <div>
                              {isUnanswered && <span className="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-md font-bold">Unanswered</span>}
                              {!isUnanswered && isCorrect && <span className="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-md font-bold">Correct (+1.0)</span>}
                              {!isUnanswered && !isCorrect && <span className="bg-rose-100 text-rose-800 px-2.5 py-1 rounded-md font-bold">Incorrect (-0.25)</span>}
                            </div>
                          </div>

                          {/* Question Text */}
                          <h4 className="font-bold text-slate-900 text-sm md:text-base">
                            {q.question}
                          </h4>

                          {/* Options Grid */}
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs font-medium">
                            {q.options.map((opt, oIdx) => {
                              const letter = String.fromCharCode(65 + oIdx);
                              const isThisCorrect = oIdx === q.correct;
                              const isThisUserSel = oIdx === userAns;

                              let optClass = "border-slate-200 bg-white text-slate-700";
                              if (isThisCorrect) {
                                optClass = "border-emerald-400 bg-emerald-50 text-emerald-900 font-bold";
                              } else if (isThisUserSel && !isThisCorrect) {
                                optClass = "border-rose-400 bg-rose-50 text-rose-900 font-bold";
                              }

                              return (
                                <div key={oIdx} className={`p-2.5 rounded-lg border flex items-center justify-between ${optClass}`}>
                                  <span><strong>{letter}.</strong> {opt}</span>
                                  {isThisCorrect && <Icon name="check" className="w-4 h-4 text-emerald-600 shrink-0" />}
                                  {isThisUserSel && !isThisCorrect && <Icon name="x" className="w-4 h-4 text-rose-600 shrink-0" />}
                                </div>
                              );
                            })}
                          </div>

                          {/* Detailed Explanation */}
                          <div className="p-3 rounded-lg bg-white border border-slate-200 text-xs space-y-2 mt-2">
                            <div>
                              <strong className="text-emerald-700">Correct Answer Explanation: </strong>
                              <span className="text-slate-700">{q.explanation}</span>
                            </div>
                            {!isCorrect && userAns !== undefined && (
                              <div className="pt-2 border-t border-slate-100 text-rose-900">
                                <strong className="text-rose-700">Why selected Option {String.fromCharCode(65 + userAns)} was incorrect: </strong>
                                <span>{q.wrongExplanations[userAns > q.correct ? userAns - 1 : userAns]}</span>
                              </div>
                            )}
                          </div>

                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="no-print bg-white border-t border-slate-200 py-4 px-6 text-center text-xs text-slate-500 font-medium">
            <p>Class XI Biology Chapter 5 Interactive Evaluation System • <strong className="text-sky-800">Qashqarian Academy 🏔️</strong></p>
          </footer>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
