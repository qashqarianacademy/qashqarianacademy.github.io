        if (quizStarted && !isSubmitted && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                setIsSubmitted(true);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [quizStarted, isSubmitted, timeLeft]);

      // Keyboard Shortcuts Listener
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (!quizStarted || isSubmitted) return;
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

          const key = e.key.toUpperCase();
          if (['1', '2', '3', '4'].includes(key)) {
            handleSelectOption(parseInt(key, 10) - 1);
          } else if (['A', 'B', 'C', 'D'].includes(key)) {
            const charCode = key.charCodeAt(0) - 65;
            handleSelectOption(charCode);
          } else if (e.key === 'ArrowRight') {
            if (currentIdx < QUESTIONS.length - 1) setCurrentIdx(prev => prev + 1);
          } else if (e.key === 'ArrowLeft') {
            if (currentIdx > 0) setCurrentIdx(prev => prev - 1);
          } else if (key === 'F') {
            toggleFlagQuestion(currentIdx);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [quizStarted, isSubmitted, currentIdx, userAnswers]);

      // Time formatting helper
      const formatTime = (secs) => {
        const mins = Math.floor(secs / 60);
        const s = secs % 60;
        return `${mins.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const handleSelectOption = (optionIdx) => {
        if (userAnswers.hasOwnProperty(currentIdx) || isSubmitted) return;
        setUserAnswers(prev => ({
          ...prev,
          [currentIdx]: optionIdx
        }));
      };

      };

      const scoreData = useMemo(() => {
        let correctCount = 0;
        let wrongCount = 0;
        let unattemptedCount = 0;

        QUESTIONS.forEach((q, idx) => {
          if (!userAnswers.hasOwnProperty(idx)) {
            unattemptedCount++;
          } else if (userAnswers[idx] === q.correct) {
            correctCount++;
          } else {
            wrongCount++;
          }
        });

        const grossMarks = correctCount * 1.0;
        const penalty = wrongCount * 0.25;
        const netMarks = Math.max(0, grossMarks - penalty);
        const maxMarks = QUESTIONS.length * 1.0;
        const percentage = Number(((netMarks / maxMarks) * 100).toFixed(1));

        return { correctCount, wrongCount, unattemptedCount, grossMarks, penalty, netMarks, maxMarks, percentage };
      }, [userAnswers]);

          if (!stats[sloKey]) {
            stats[sloKey] = { total: 0, correct: 0, wrong: 0, unattempted: 0 };

          stats[sloKey].total++;
          if (!userAnswers.hasOwnProperty(idx)) {
            stats[sloKey].unattempted++;
          } else if (userAnswers[idx] === q.correct) {
            stats[sloKey].correct++;

        return stats;

                  </div>
                </div>

                {/* Rules Notice */}
                <div className="bg-amber-50/80 border border-amber-200 rounded-xl p-4 text-xs text-amber-900 space-y-1.5">
                  <p className="font-bold text-amber-950 flex items-center gap-1.5">
                    <Icon name="alert-triangle" className="w-4 h-4 text-amber-600" />
                    Instructions & Scoring:
                  </p>
                  <ul className="list-disc list-inside space-y-1 pl-1 text-amber-800">
                    <li>Once an answer is chosen, it is locked.</li>
                    <li>Incorrect answers carry a <strong>-0.25 mark penalty</strong>.</li>
                    <li>Unattempted questions are not penalized.</li>
                    <li>Press <strong>Key F</strong> to flag questions for later review.</li>
                  </ul>
                </div>

                <button
                  onClick={() => setQuizStarted(true)}
                  className="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-sky-600/25 transition-all flex items-center justify-center gap-2 group text-sm"
                >
                  <span>Start Assessment (45 MCQs)</span>
                  <Icon name="arrow-right" className="w-5 h-5 group-hover:translate-x-1 transition-transform" />
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (isSubmitted) {
        const quoteObj = getMotivationalQuote(scoreData.percentage);

        return (
          <div className="min-h-screen py-8 px-4 sm:px-6 flex justify-center">
            <div className="max-w-4xl w-full bg-white rounded-2xl shadow-xl border border-sky-100 overflow-hidden animate-fadeIn space-y-6 pb-8">
              
              {/* Header Banner */}
              <div className="bg-gradient-to-r from-sky-800 via-sky-700 to-science-900 p-6 sm:p-8 text-white relative">
                <div className="flex justify-between items-center mb-2 no-print">
                  <span className="text-xs font-bold bg-white/20 px-3 py-1 rounded-full flex items-center gap-1.5">
                    🏔️ Qashqarian Academy
                  </span>
                  <span className="text-xs font-bold bg-white/10 px-3 py-1 rounded-md border border-white/20">
                    Class: XI
                  </span>
                  <button 
                    onClick={() => window.print()} 
                    className="bg-white/10 hover:bg-white/20 text-white text-xs font-semibold px-3 py-1.5 rounded-lg border border-white/20 transition-all flex items-center gap-1.5"
                  >
                    <Icon name="printer" className="w-4 h-4" />
                    Print Results
                  </button>
                </div>
                <h1 className="text-2xl sm:text-3xl font-extrabold">
                  Performance Evaluation Summary
                </h1>
                <p className="text-sky-100 text-xs sm:text-sm mt-1">
                  Chapter 7: Kingdom Protista (45 MCQs)
                </p>
              </div>

              <div className="p-6 sm:p-8 space-y-8">
                
                {/* Motivational Quote Banner */}
                <div className="bg-sky-50/80 border-l-4 border-sky-600 p-4 rounded-r-xl space-y-1">
                  <p className="text-sm font-semibold text-sky-950 italic">
                    "{quoteObj.quote}"
                  </p>
                  <p className="text-xs text-sky-700 font-bold">— {quoteObj.author}</p>
                </div>

                {/* Performance Metrics */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                  <div className="bg-sky-50 border border-sky-100 rounded-xl p-4 text-center">
                    <p className="text-xs text-slate-500 font-semibold mb-1">Net Percentage</p>
                    <p className="text-3xl font-black text-sky-600">{scoreData.percentage}%</p>
                  </div>
                  <div className="bg-emerald-50 border border-emerald-100 rounded-xl p-4 text-center">
                    <p className="text-xs text-emerald-700 font-semibold mb-1">Correct Answers</p>
                    <p className="text-3xl font-black text-emerald-600">{scoreData.correctCount}</p>
                    <p className="text-[10px] text-emerald-600 font-medium">+{scoreData.grossMarks} Marks</p>
                  </div>
                  <div className="bg-rose-50 border border-rose-100 rounded-xl p-4 text-center">
                    <p className="text-xs text-rose-700 font-semibold mb-1">Wrong Answers</p>
                    <p className="text-3xl font-black text-rose-600">{scoreData.wrongCount}</p>
                    <p className="text-[10px] text-rose-600 font-medium">-{scoreData.penalty} Penalty</p>
                  </div>
                  <div className="bg-amber-50 border border-amber-100 rounded-xl p-4 text-center">
                    <p className="text-xs text-amber-700 font-semibold mb-1">Unattempted</p>
                    <p className="text-3xl font-black text-amber-600">{scoreData.unattemptedCount}</p>
                    <p className="text-[10px] text-amber-600 font-medium">0 Penalty</p>
                  </div>
                </div>

                {/* Net Score Bar */}
                <div className="bg-slate-900 text-white rounded-xl p-4 flex justify-between items-center text-sm">
                  <span>Final Score (after -0.25 penalty):</span>
                  <span className="font-extrabold text-sky-400 text-base">
                    {scoreData.netMarks} / {scoreData.maxMarks} Marks
                  </span>
                </div>

                {/* Weak Area SLO Breakdown */}
                <div className="space-y-3">
                  <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                    <Icon name="bar-chart" className="w-5 h-5 text-sky-600" />
                    SLO Performance & Mastery Breakdown
                  </h3>

                  <div className="space-y-3 max-h-80 overflow-y-auto pr-2 custom-scrollbar">
                    {Object.entries(sloAnalysis).map(([slo, stats], idx) => {
                      const sloPct = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
                      return (
                        <div key={idx} className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs space-y-2">
                          <div className="flex justify-between items-start gap-2">
                            <span className="font-semibold text-slate-800">{slo}</span>
                            <span className={`font-bold px-2 py-0.5 rounded text-[11px] ${
                              sloPct >= 80 ? 'bg-emerald-100 text-emerald-800' :
                              sloPct >= 50 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'
                            }`}>
                              {sloPct}% Mastery
                            </span>
                          </div>
                          <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div 
                              className={`h-full transition-all duration-500 ${
                                sloPct >= 80 ? 'bg-emerald-500' : sloPct >= 50 ? 'bg-amber-500' : 'bg-rose-500'
                              }`}
                              style={{ width: `${sloPct}%` }}
                            />
                          </div>
                          <div className="flex gap-4 text-[11px] text-slate-500">
                            <span>Correct: {stats.correct}</span>
                            <span>Wrong: {stats.wrong}</span>
                            <span>Skipped: {stats.unattempted}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Question Review Section with Filter & Search */}
                <div className="space-y-4 no-print">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2">
                    <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                      <Icon name="book-open" className="w-5 h-5 text-sky-600" />
                      Detailed Explanations & Rationale Review
                    </h3>

                    {/* Filter Pills */}
                    <div className="flex flex-wrap gap-1.5 text-xs">
                      {[
                        { id: 'all', label: 'All' },
                        { id: 'correct', label: 'Correct' },
                        { id: 'wrong', label: 'Wrong' },
                        { id: 'skipped', label: 'Skipped' },
                        { id: 'flagged', label: 'Flagged' },
                      ].map(tab => (
                        <button
                          key={tab.id}
                          onClick={() => setReviewFilter(tab.id)}
                          className={`px-3 py-1.5 rounded-lg font-semibold transition-all ${
                            reviewFilter === tab.id
                              ? 'bg-sky-600 text-white shadow-sm'
                              : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                          }`}
                        >
                          {tab.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Search Bar */}
                  <div className="relative">
                    <input
                      type="text"
                      placeholder="Search question, SLO, or explanation..."
                      value={reviewSearch}
                      onChange={(e) => setReviewSearch(e.target.value)}
                      className="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent bg-slate-50/50"
                    />
                    <div className="absolute left-3 top-3 text-slate-400">
                      <Icon name="search" className="w-4 h-4" />
                    </div>
                  </div>

                  {/* Question Cards */}
                  <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar">
                    {filteredReviewQuestions.length === 0 ? (
                      <div className="p-8 text-center text-xs text-slate-500 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                        No questions match the selected filter.
                      </div>
                    ) : (
                      filteredReviewQuestions.map((q) => {
                        const qIdx = q.qIdx;
                        const userSel = userAnswers[qIdx];
                        const isCorrect = userSel === q.correct;
                        const isUnattempted = !userAnswers.hasOwnProperty(qIdx);
                        const isFlagged = flaggedQuestions[qIdx];

                        return (
                          <div 
                            key={q.id}
                            className={`p-4 rounded-xl border text-xs space-y-2.5 transition-all ${
                              isCorrect ? 'bg-emerald-50/50 border-emerald-200' :
                              isUnattempted ? 'bg-amber-50/50 border-amber-200' : 'bg-rose-50/50 border-rose-200'
                            }`}
                          >
                            <div className="flex justify-between items-start gap-2">
                              <span className="font-bold text-slate-900 flex items-center gap-2">
                                <span>Q{qIdx + 1}. {q.question}</span>
                                {isFlagged && (
                                  <span className="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded font-bold flex items-center gap-1">
                                    <Icon name="flag" className="w-3 h-3 text-amber-600" /> Flagged
                                  </span>
                                )}
                              </span>
                              <span className={`px-2 py-0.5 rounded font-bold text-[10px] whitespace-nowrap shrink-0 ${
                                isCorrect ? 'bg-emerald-600 text-white' :
                                isUnattempted ? 'bg-amber-500 text-white' : 'bg-rose-600 text-white'
                              }`}>
                                {isCorrect ? 'CORRECT (+1.0)' : isUnattempted ? 'SKIPPED (0.0)' : 'WRONG (-0.25)'}
                              </span>
                            </div>

                            <p className="text-[11px] text-slate-500 font-medium">{q.slo}</p>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                              {q.options.map((opt, oIdx) => {
                                const isOptCorrect = oIdx === q.correct;
                                const isOptUserChoice = oIdx === userSel;

                                return (
                                  <div 
                                    key={oIdx}
                                    className={`p-2 rounded-lg border font-medium flex items-center justify-between ${
                                      isOptCorrect ? 'bg-emerald-100 border-emerald-300 text-emerald-900 font-bold' :
                                      isOptUserChoice ? 'bg-rose-100 border-rose-300 text-rose-900' : 'bg-white border-slate-200 text-slate-600'
                                    }`}
                                  >
                                    <span>{String.fromCharCode(65 + oIdx)}. {opt}</span>
                                    {isOptCorrect && <Icon name="check" className="w-3.5 h-3.5 text-emerald-700" />}
                                    {isOptUserChoice && !isOptCorrect && <Icon name="x" className="w-3.5 h-3.5 text-rose-700" />}
                                  </div>
                                );
                              })}
                            </div>

                            {/* Detailed Explanation */}
                            <div className="bg-white/90 p-3 rounded-lg border border-slate-200 text-slate-700 leading-relaxed space-y-1.5">
                              <p className="text-slate-800">
                                <strong className="text-sky-900">Correct Answer Rationale: </strong> 
                                {q.explanation}
                              </p>

                              {!isCorrect && !isUnattempted && q.wrongExplanations && (
                                <div className="mt-2 pt-2 border-t border-slate-100 text-[11px] text-rose-900 bg-rose-50/60 p-2 rounded-md">
                                  <strong>Why option {String.fromCharCode(65 + userSel)} is incorrect: </strong>
                                  {q.wrongExplanations[userSel] || "This choice does not satisfy the scientific concept."}
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>

                {/* Restart Button */}
                <button
                  onClick={() => {
                    setIsSubmitted(false);
                    setQuizStarted(false);
                    setCurrentIdx(0);
                    setUserAnswers({});
                    setFlaggedQuestions({});
                    setTimeLeft(45 * 60);
                  }}
                  className="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-sky-600/25 transition-all flex items-center justify-center gap-2 text-sm no-print"
                >
                  <Icon name="rotate-ccw" className="w-5 h-5" />
                  <span>Restart Assessment</span>
                </button>

              </div>
            </div>
          </div>
        );
      }

      const flaggedCount = Object.values(flaggedQuestions).filter(Boolean).length;

      return (
        <div className="min-h-screen py-6 px-4 sm:px-6 flex flex-col items-center">
          
          {/* Top Header Navigation Card */}
          <div className="max-w-3xl w-full bg-white rounded-2xl shadow-sm border border-sky-100 p-4 mb-4 space-y-3">
            
            <div className="flex justify-between items-center text-xs sm:text-sm font-bold text-sky-900">
              <span className="flex items-center gap-1.5 text-base sm:text-lg tracking-tight">
                🏔️ Qashqarian Academy
              </span>
              
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowNavGrid(!showNavGrid)}
                  className="px-2.5 py-1 bg-sky-50 hover:bg-sky-100 text-sky-800 rounded-lg text-xs font-semibold flex items-center gap-1.5 border border-sky-200 transition-all"
                >
                  <Icon name="grid" className="w-3.5 h-3.5" />
                  <span>Grid ({Object.keys(userAnswers).length}/{QUESTIONS.length})</span>
                </button>

                <span className="bg-sky-100 text-sky-800 px-2.5 py-1 rounded-lg font-bold text-xs">
                  Class: XI
                </span>
              </div>
            </div>

            {/* Question Counter & 45 Min Timer */}
            <div className="flex justify-between items-center text-xs font-semibold text-slate-600">
              <div className="flex items-center gap-3">
                <span className="text-sky-900 font-extrabold text-sm">Q {currentIdx + 1} / {QUESTIONS.length}</span>
                {flaggedCount > 0 && (
                  <span className="text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded text-[11px] font-bold flex items-center gap-1">
                    <Icon name="flag" className="w-3 h-3 text-amber-600" />
                    {flaggedCount} Flagged
                  </span>
                )}
              </div>

              <div className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg font-mono font-bold ${
                timeLeft < 300 ? 'bg-rose-100 text-rose-700 animate-pulse' : 'bg-sky-50 text-sky-800'
              }`}>
                <Icon name="clock" className="w-3.5 h-3.5" />
                <span>{formatTime(timeLeft)}</span>
              </div>
            </div>

            {/* Progress Bar */}
            <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
              <div 
                className="bg-sky-600 h-full transition-all duration-300"
                style={{ width: `${((currentIdx + 1) / QUESTIONS.length) * 100}%` }}
              />
            </div>
          </div>

          {/* Grid Navigator Overlay */}
          {showNavGrid && (
            <div className="max-w-3xl w-full bg-white rounded-2xl shadow-lg border border-sky-200 p-5 mb-4 animate-fadeIn space-y-3">
              <div className="flex justify-between items-center text-xs font-bold text-slate-800 border-b pb-2">
                <span>Question Quick Navigator Matrix</span>
                <button 
                  onClick={() => setShowNavGrid(false)}
                  className="text-slate-400 hover:text-slate-600"
                >
                  <Icon name="x" className="w-4 h-4" />
                </button>
              </div>

              <div className="grid grid-cols-5 sm:grid-cols-9 gap-2 max-h-52 overflow-y-auto p-1 custom-scrollbar">
                {QUESTIONS.map((_, idx) => {
                  const isAns = userAnswers.hasOwnProperty(idx);
                  const isCur = currentIdx === idx;
                  const isFlg = !!flaggedQuestions[idx];

                  let boxStyle = "bg-slate-100 text-slate-700 hover:bg-slate-200";
                  if (isCur) boxStyle = "bg-sky-600 text-white font-bold ring-2 ring-sky-500/50";
                  else if (isAns) boxStyle = "bg-emerald-100 text-emerald-900 font-semibold border border-emerald-300";

                  return (
                    <button
                      key={idx}
                      onClick={() => {
                        setCurrentIdx(idx);
                        setShowNavGrid(false);
                      }}
                      className={`h-8 rounded-lg text-xs transition-all relative flex items-center justify-center ${boxStyle}`}
                    >
                      {idx + 1}
                      {isFlg && (
                        <span className="absolute -top-1 -right-1 bg-amber-500 w-2.5 h-2.5 rounded-full border border-white" />
                      )}
                    </button>
                  );
                })}
              </div>

              <div className="flex gap-4 text-[10px] text-slate-500 pt-2 border-t justify-center">
                <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-300" /> Answered</span>
                <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-200" /> Unanswered</span>
                <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-sky-600" /> Current</span>
                <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-amber-500" /> Flagged</span>
              </div>
            </div>
          )}

          {/* Main Question Card */}
          <div className="max-w-3xl w-full bg-white rounded-2xl shadow-lg border border-sky-100 p-6 sm:p-8 relative overflow-hidden flex flex-col min-h-[460px] justify-between">
            
            {/* Watermark Background */}
            <div className="watermark-bg">
              <p className="text-5xl sm:text-6xl font-black text-sky-900 tracking-widest">
                🏔️ QASHQARIAN ACADEMY
              </p>
            </div>

            {/* Question Header & Options */}
            <div className="relative z-10 space-y-5">
              
              <div className="flex justify-between items-center gap-2">
                <div className="inline-block bg-sky-50 border border-sky-200 text-sky-900 text-xs font-bold px-3 py-1 rounded-full">
                  {currentQ.slo}
                </div>

                <button
                  onClick={() => toggleFlagQuestion(currentIdx)}
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                    isCurrentFlagged 
                      ? 'bg-amber-100 text-amber-800 border border-amber-300' 
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                  title="Bookmark for review (Key: F)"
                >
                  <Icon name="flag" className={`w-3.5 h-3.5 ${isCurrentFlagged ? 'text-amber-600 fill-amber-500' : ''}`} />
                  <span>{isCurrentFlagged ? 'Flagged' : 'Flag'}</span>
                </button>
              </div>

              <h2 className="text-base sm:text-lg font-bold text-slate-900 leading-snug">
                Q{currentIdx + 1}. {currentQ.question}
              </h2>

              {/* Options */}
              <div className="space-y-3 pt-2">
                {currentQ.options.map((optionText, optIdx) => {
                  const isSelected = selectedOption === optIdx;
                  const isCorrect = currentQ.correct === optIdx;

                  let btnStyle = "border-slate-200 hover:border-sky-300 hover:bg-sky-50/50 text-slate-800 bg-white";

                  if (isAnswered) {
                    if (quizMode === 'practice') {
                      if (isCorrect) {
                        btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-950 font-semibold ring-2 ring-emerald-500/20";
                      } else if (isSelected) {
                        btnStyle = "border-rose-500 bg-rose-50 text-rose-950 font-semibold ring-2 ring-rose-500/20";
                      } else {
                        btnStyle = "border-slate-200 opacity-60 bg-white text-slate-500";
                      }
                    } else {
                      if (isSelected) {
                        btnStyle = "border-sky-600 bg-sky-50 text-sky-950 font-semibold ring-2 ring-sky-500/20";
                      } else {
                        btnStyle = "border-slate-200 opacity-60 bg-white text-slate-500";
                      }
                    }
                  }

                  return (
                    <button
                      key={optIdx}
                      disabled={isAnswered}
                      onClick={() => handleSelectOption(optIdx)}
                      className={`w-full p-3.5 sm:p-4 rounded-xl border-2 text-left text-xs sm:text-sm transition-all flex items-center justify-between gap-3 ${btnStyle}`}
                    >
                      <div className="flex items-center gap-3">
                        <span className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shrink-0 ${
                          isSelected ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-700'
                        }`}>
                          {String.fromCharCode(65 + optIdx)}
                        </span>
                        <span>{optionText}</span>
                      </div>

                      {isAnswered && quizMode === 'practice' && (
                        <div>
                          {isCorrect && <Icon name="check" className="w-5 h-5 text-emerald-600" />}
                          {isSelected && !isCorrect && <Icon name="x" className="w-5 h-5 text-rose-600" />}
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>

              {/* Practice Explanation Box */}
              {isAnswered && quizMode === 'practice' && (
                <div className={`mt-4 p-4 rounded-xl text-xs leading-relaxed space-y-1.5 animate-fadeIn border ${
                  selectedOption === currentQ.correct 
                    ? 'bg-emerald-50/90 border-emerald-200 text-emerald-950' 
                    : 'bg-rose-50/90 border-rose-200 text-rose-950'
                }`}>
                  <p className="font-bold flex items-center gap-1.5">
                    <Icon name="info" className="w-4 h-4" />
                    {selectedOption === currentQ.correct ? 'Correct Answer Rationale:' : 'Incorrect Answer Explanation:'}
                  </p>
                  <p className="text-slate-800">{currentQ.explanation}</p>
                  
                  {selectedOption !== currentQ.correct && currentQ.wrongExplanations && (
                    <p className="text-rose-900 font-medium pt-1 border-t border-rose-200/60">
                      <strong>Why option {String.fromCharCode(65 + selectedOption)} is wrong: </strong>
                      {currentQ.wrongExplanations[selectedOption]}
                    </p>
                  )}
                </div>
              )}
            </div>

            {/* Bottom Navigation */}
            <div className="relative z-10 pt-6 mt-6 border-t border-slate-100 flex justify-between items-center gap-4">
              <button
                disabled={currentIdx === 0}
                onClick={() => setCurrentIdx(prev => prev - 1)}
                className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1.5"
              >
                <Icon name="arrow-left" className="w-4 h-4" />
                Previous
              </button>

              <div className="flex gap-2">
                {currentIdx < QUESTIONS.length - 1 ? (
                  <button
                    onClick={() => setCurrentIdx(prev => prev + 1)}
                    className="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold shadow-md shadow-sky-600/20 transition-all flex items-center gap-1.5"
                  >
                    Next
                    <Icon name="arrow-right" className="w-4 h-4" />
                  </button>
                ) : (
                  <button
                    onClick={() => setIsSubmitted(true)}
                    className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-md shadow-emerald-600/20 transition-all flex items-center gap-1.5"
                  >
                    Submit Test
                    <Icon name="check" className="w-4 h-4" />
                  </button>
                )}
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
